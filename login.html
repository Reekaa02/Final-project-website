<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Log In ♡</title>
  <link rel="stylesheet" href="css/style.css" />
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Cute+Font&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body class="auth-page">

  
  <a href="index.html" class="home-btn" title="Back to Home">
    <i class="fas fa-home"></i>
  </a>

  <div class="auth-container">
    <div class="auth-card">
      <h1>Log In <span class="heart">♥</span></h1>
      <p class="subtitle">Welcome back! We've missed you~ ♡</p>

      <form id="loginForm">
  <div class="input-group">
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="your.email@gmail.com" required />
  </div>

  <div class="input-group">
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="••••••••" required />
  </div>

  
<button type="submit" class="btn primary">Log In</button>
<p id="loginMessage" style="color:#ff69b4; margin-top:1rem; min-height:1.4rem;"></p>
</form>
</body>
</html>

<script>

document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();
    const msg      = document.getElementById('loginMessage');

    if (!email || !password) {
        msg.textContent = "Please fill in both fields cutie~";
        msg.style.color = "#ff1493";
        return;
    }

  
    const storedEmail = localStorage.getItem('userEmail');

    if (storedEmail && storedEmail === email) {
        
        loginUser(email);
        msg.textContent = "Welcome back! ♡ Redirecting...";
        msg.style.color = "#ff69b4";
        setTimeout(() => {
            window.location.href = 'profile.html';
        }, 1200);
    } else {
        msg.textContent = "Hmm... we don't recognize that email yet~ Try signing up!";
        msg.style.color = "#ff1493";
    }
});
</script>

<script src="js/auth.js"></script>
<script src="js/main.js"></script>
</body>
</html>
