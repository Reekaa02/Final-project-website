<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign up ♡</title>
  <link rel="stylesheet" href="css/style.css" /> 
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Cute+Font&display=swap" rel="stylesheet">
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
 </head>
 <body class="auth-page">

  
  <a href="index.html" class="home-btn" title="Back to Home">
    <i class="fas fa-home"></i>
  </a>

  <div class="auth-container">
    <div class="auth-card">
      
<h1>Sign Up ♡</h1>
<p class="subtitle">Let's make new memories together~</p>

 <form id="Signup Form">
 
  <div class="input-group">
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="your.email@gmail.com" required />
  </div>

  <div class="input-group">
    <label for="name">Name</label>
    <input type="text" id="name" placeholder="Rawr" required />
  </div>

  <div class="input-group">
    <label for="age">Age</label>
    <input type="number" id="age" placeholder="Must be 18 or older" min="18" required />
  </div>

  <div class="input-group">
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="password" required />
  </div>

  <button type="submit" class="btn primary">Create Account</button>
  <script>document.getElementById('signupForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const email    = document.getElementById('email').value.trim();
    const name     = document.getElementById('name').value.trim();
    const age      = document.getElementById('age').value.trim();
    const password = document.getElementById('password').value.trim();

    if (!email || !name || !age || !password) {
        alert("Please fill everything out~ ♡");
        return;
    }

    if (localStorage.getItem('userEmail') === email) {
        alert("This email is already taken cutie! Try logging in instead~");
        return;
    }

    
    loginUser(email, name, age);

    alert("Yay! Account created~ You're now logged in ♡");
    window.location.href = 'profile.html';
});
</script>

</form>

<p class="switch">Already have an account? <a href="login.html">Log In</a></p>


<script src="js/auth.js"></script>
<script src="js/main.js"></script>
</body>
</html>
